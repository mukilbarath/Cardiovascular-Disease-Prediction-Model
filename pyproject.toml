[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiovascular-stacking-research"
version = "0.1.0"
description = "Reproducible research pipeline for cardiovascular disease stacking classification"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/mukilbarath/Cardiovascular-Disease-Prediction-Model"

[project.scripts]
cardio-research = "cardio_research.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I"]
